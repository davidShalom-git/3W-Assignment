<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tirupati Cottage - Official QR Code Standee</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Playfair+Display:wght@700&family=Anek+Tamil:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Outfit', -apple-system, sans-serif;
      background: #FAF8F5;
      color: #1B4332;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .standee-card {
      background: #FFFFFF;
      width: 100%;
      max-width: 440px;
      border-radius: 24px;
      padding: 36px 28px;
      text-align: center;
      box-shadow: 0 16px 40px -8px rgba(27, 67, 50, 0.15), 0 2px 10px rgba(0,0,0,0.04);
      border: 2px solid rgba(27, 67, 50, 0.12);
      position: relative;
    }
    .brand-mark {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: linear-gradient(135deg, #1B4332 0%, #2D6A4F 100%);
      color: #FAF8F5;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 12px;
      box-shadow: 0 4px 14px rgba(27, 67, 50, 0.25);
    }
    .hotel-name {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.85rem;
      font-weight: 700;
      color: #1B4332;
      line-height: 1.2;
      margin-bottom: 4px;
    }
    .hotel-location {
      font-size: 0.88rem;
      color: #718096;
      font-weight: 600;
      margin-bottom: 22px;
    }
    .qr-frame {
      background: #FAF8F5;
      border: 2px dashed rgba(27, 67, 50, 0.2);
      border-radius: 20px;
      padding: 16px;
      display: inline-block;
      margin-bottom: 20px;
    }
    .qr-img {
      width: 240px;
      height: 240px;
      display: block;
      border-radius: 12px;
    }
    .scan-title {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1B4332;
      margin-bottom: 4px;
    }
    .scan-subtitle-ta {
      font-family: 'Anek Tamil', sans-serif;
      font-size: 0.92rem;
      font-weight: 700;
      color: #C86D51;
      margin-bottom: 18px;
    }
    .url-pill {
      display: inline-block;
      background: #EBF5F0;
      color: #1B4332;
      padding: 7px 16px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      margin-bottom: 20px;
      border: 1px solid rgba(27, 67, 50, 0.15);
    }
    .owner-box {
      border-top: 1px solid #E8E2D8;
      padding-top: 16px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 0.86rem;
    }
    .owner-label {
      color: #718096;
      font-size: 0.74rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 700;
    }
    .owner-value {
      font-weight: 700;
      color: #1B4332;
    }
    .actions-bar {
      margin-top: 24px;
      display: flex;
      gap: 12px;
    }
    .btn {
      padding: 12px 24px;
      border-radius: 9999px;
      font-weight: 700;
      font-size: 0.92rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
    }
    .btn-print {
      background: linear-gradient(135deg, #1B4332 0%, #2D6A4F 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(27, 67, 50, 0.25);
    }
    .btn-download {
      background: #FFFFFF;
      color: #1B4332;
      border: 1.5px solid rgba(27, 67, 50, 0.25);
    }
    @media print {
      body { background: #FFFFFF; padding: 0; }
      .actions-bar { display: none; }
      .standee-card { box-shadow: none; border: 1px solid #000; margin: 0 auto; max-width: 90%; }
    }
  </style>
</head>
<body>

  <div class="standee-card">
    <div class="brand-mark">T</div>
    <h1 class="hotel-name">Tirupati Cottage</h1>
    <p class="hotel-location">Tiruvannamalai • Arunachala Mountain & Temple View</p>

    <div class="qr-frame">
      <img src="assets/images/qr-code.png" alt="Scan QR Code for Tirupati Cottage" class="qr-img" />
    </div>

    <div class="scan-title">📱 Scan to View Rooms & Direct Booking</div>
    <div class="scan-subtitle-ta">அறைகள் & படங்களை பார்க்க ஸ்கேன் செய்யவும்</div>

    <div>
      <a href="https://room-showcase-ashen.vercel.app" target="_blank" class="url-pill">
        🌐 room-showcase-ashen.vercel.app
      </a>
    </div>

    <div class="owner-box">
      <div>
        <div class="owner-label">Property Owner</div>
        <div class="owner-value">Arasu Palani</div>
      </div>
      <div>
        <div class="owner-label">Direct Phone</div>
        <div class="owner-value">📞 +91 75984 30544</div>
      </div>
    </div>
  </div>

  <div class="actions-bar">
    <button class="btn btn-print" onclick="window.print()">
      🖨️ Print Standee Card
    </button>
    <a href="assets/images/qr-code.png" download="Tirupati-Cottage-QR.png" class="btn btn-download">
      💾 Download QR Image
    </a>
  </div>

</body>
</html>
